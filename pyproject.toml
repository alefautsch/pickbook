[project]
name = "pickbook"
version = "0.3.0"
description = "Pickbook — mobile dynasty draft assistant for Sleeper (WAR, trade value, Claude)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
]

[project.scripts]
dynasty-draft = "dynasty_draft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dynasty_draft"]

[tool.uv]
package = true
